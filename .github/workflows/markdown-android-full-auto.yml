name: Markdown Android — full auto build

on:
  workflow_dispatch:
  push:
    branches:
      - "Living-relation/markdown-android-full-auto-ee3c"
    paths:
      - "apps/markdown-notes-android/**"
      - ".github/workflows/markdown-android-full-auto.yml"

concurrency:
  group: markdown-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ci:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble debug APK and run UI checks
        working-directory: apps/markdown-notes-android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :core-markdown:testDebugUnitTest :core-files:testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: markdown-notes-debug-apk
          path: apps/markdown-notes-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: markdown-notes-ui-test-results
          path: apps/markdown-notes-android/**/build/reports/tests/**
          if-no-files-found: warn

  ui-emulator:
    runs-on: macos-13
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instrumented UI checks on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          working-directory: apps/markdown-notes-android
          script: |
            echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
